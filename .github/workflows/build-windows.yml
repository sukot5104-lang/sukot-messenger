name: Build Windows EXE

on:
  push:
    branches: [main]
    paths: ["installers/windows/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: installers/windows
        run: npm install

      - name: Build EXE (installer + portable)
        working-directory: installers/windows
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SUKOT-Messenger-Windows-EXE
          path: |
            installers/windows/dist/*.exe
          retention-days: 90
